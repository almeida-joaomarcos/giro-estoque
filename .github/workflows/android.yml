name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Analisar, testar e gerar APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versões
        run: flutter --version

      - name: Dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze

      - name: Testes
        run: flutter test

      - name: Build do APK
        run: flutter build apk --release

      - name: Publicar APK
        uses: actions/upload-artifact@v7
        with:
          name: giro-apk-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90
